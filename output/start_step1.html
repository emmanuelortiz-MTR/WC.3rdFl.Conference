<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step 1 of 7 – Locate the Shared Space Screen and turn it on</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
        .button { display: inline-block; padding: 1rem 2rem; margin: 1rem 0; background: #007bff; color: white; text-decoration: none; border-radius: 8px; }
        img, video, iframe { max-width: 100%; height: auto; margin: 1rem 0; }
        iframe { width: 100%; height: 340px; border: none; }
        .nav { margin-top: 2rem; }
        .nav a { margin-right: 1rem; }
        .lang-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #28a745;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            z-index: 1000;
        }
        .lang-toggle:hover {
            background: #218838;
        }
        .lang-en, .lang-es, .instruction-en, .instruction-es {
            display: none;
        }
        .lang-en.active, .lang-es.active, .instruction-en.active, .instruction-es.active {
            display: block;
        }
        .step-counter-en, .step-counter-es {
            display: none;
        }
        .step-counter-en.active, .step-counter-es.active {
            display: inline;
        }
    </style>
</head>
<body>
    <button class="lang-toggle" onclick="toggleLanguage()">Español</button>
    <h1>
        <span class="lang-en active">Locate the Shared Space Screen and turn it on</span>
        <span class="lang-es">Locate the Shared Space Screen and turn it on</span>
    </h1>
    <p><strong>
        <span class="lang-en active step-counter-en">Step 1 of 7</span>
        <span class="lang-es step-counter-es">Paso 1 de 7</span>
    </strong></p>
    <div class="instruction-en active">The TV looks something like this: </div>
    <div class="instruction-es">The TV looks something like this: </div>
    <img src="static/images/3rdFl.TV.off.jpg" alt="Picture showing where the main room TV is">
    <div class="nav">
        
        <a href="start_step2.html" class="button"><span class="lang-en active">Next ➔</span><span class="lang-es">Siguiente ➔</span></a>
        <a href="index.html" class="button">
            <span class="lang-en active">🏠 Home</span>
            <span class="lang-es">🏠 Inicio</span>
        </a>
    </div>
    <script>
        let currentLang = 'en';
        
        function toggleLanguage() {
            const toggleBtn = document.querySelector('.lang-toggle');
            if (currentLang === 'en') {
                currentLang = 'es';
                toggleBtn.textContent = 'English';
            } else {
                currentLang = 'en';
                toggleBtn.textContent = 'Español';
            }
            updateLanguage(currentLang);
        }
        
        function updateLanguage(lang) {
            document.querySelectorAll('.lang-en, .lang-es, .instruction-en, .instruction-es, .step-counter-en, .step-counter-es').forEach(el => {
                el.classList.remove('active');
                if (el.classList.contains(`lang-${lang}`) || 
                    el.classList.contains(`instruction-${lang}`) ||
                    el.classList.contains(`step-counter-${lang}`)) {
                    el.classList.add('active');
                }
            });
            localStorage.setItem('preferredLanguage', lang);
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            const savedLang = localStorage.getItem('preferredLanguage') || 'en';
            currentLang = savedLang;
            if (savedLang === 'es') {
                document.querySelector('.lang-toggle').textContent = 'English';
            }
            updateLanguage(savedLang);
        });
    </script>
</body>
</html>
